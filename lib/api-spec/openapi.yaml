openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farm-calendar
    description: Offline-first farm calendar synchronization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /farm-calendar/sync:
    post:
      operationId: syncFarmCalendar
      tags: [farm-calendar]
      summary: Accept a locally queued farm calendar snapshot
      description: Receives the latest device-local calendar snapshot after connectivity returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmCalendarSyncRequest"
      responses:
        "200":
          description: Calendar snapshot accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmCalendarSyncResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FarmCalendarActivity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        time:
          type: string
        location:
          type: string
        notes:
          type: string
        done:
          type: boolean
      required:
        - id
        - type
        - title
        - date
        - time
        - location
        - notes
        - done
    FarmCalendarSyncRequest:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/FarmCalendarActivity"
      required:
        - activities
    FarmCalendarSyncResponse:
      type: object
      properties:
        acceptedCount:
          type: integer
        syncedAt:
          type: string
          format: date-time
      required:
        - acceptedCount
        - syncedAt

