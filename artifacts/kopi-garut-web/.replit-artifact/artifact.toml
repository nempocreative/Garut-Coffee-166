kind = "web"
previewPath = "/kopi-garut-web/"
title = "Garut Beans G-Beans Web"
description = "Situs Garut Beans G-Beans yang berdiri mandiri dari aplikasi mobile, dengan katalog kopi, keranjang, pesanan, dan cerita ekosistem dalam tampilan responsif untuk ponsel hingga desktop."
version = "1.0.0"
id = "artifacts/kopi-garut-web"
router = "path"

[[services]]
name = "web"
paths = [ "/kopi-garut-web/" ]
localPort = 21729

[services.development]
run = "pnpm --filter @workspace/kopi-garut-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kopi-garut-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/kopi-garut-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21729"
BASE_PATH = "/kopi-garut-web/"
